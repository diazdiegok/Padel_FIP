name: Actualizar datos FIP

# El ranking de la FIP se publica semanalmente, pero los resultados de torneos
# llegan a diario: se ejecuta cada día y solo confirma si algo ha cambiado.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Reconstruir el histórico completo de la temporada'
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar y transformar datos
        run: node scripts/update-data.mjs ${{ inputs.full && '--full' || '' }}

      # Si la FIP cambia su API, es preferible fallar aquí que publicar
      # un dataset incoherente en el panel.
      - name: Validar coherencia
        run: node scripts/check-data.mjs

      - name: Publicar cambios
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "chore(data): ranking FIP $(date -u +'%Y-%m-%d')"
          git push
